<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | JHON NISHI</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #fafafa; color: #333; margin: 0; line-height: 1.6; }
        header { background: #fff; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eaeaea; }
        .logo a { font-weight: bold; font-size: 1.2rem; color: #333; text-decoration: none; }
        nav a { margin-left: 20px; text-decoration: none; color: #666; font-size: 0.9rem; }
        .container { max-width: 600px; margin: 60px auto; padding: 40px; background: #fff; border: 1px solid #eaeaea; border-radius: 8px; }
        h1 { border-bottom: 2px solid #111; padding-bottom: 10px; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        input[type="text"], input[type="email"], textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background: #111; color: #fff; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 0.9rem; }
        button:hover { background: #333; }
        footer { text-align: center; padding: 30px; color: #999; font-size: 0.8rem; margin-top: 80px; border-top: 1px solid #eaeaea; }
    </style>
</head>
<body>
    <header>
        <div class="logo"><a href="index.html">SATO REN.</a></div>
        <nav>
            <a href="about.html">About</a>
            <a href="index.html#works">Works</a>
            <a href="contact.html" style="color:#111; font-weight:bold;">Contact</a>
        </nav>
    </header>
    <div class="container">
        <h1>Contact</h1>
        <p>お仕事のご依頼・ご相談は以下のフォームよりお気軽にお問い合わせください。</p>
        <form onsubmit="event.preventDefault(); alert('お問い合わせを受け付けました。');">
            <div class="form-group">
                <label>お名前</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>メールアドレス</label>
                <input type="email" required>
            </div>
            <div class="form-group">
                <label>メッセージ</label>
                <textarea rows="5" required></textarea>
            </div>
            <button type="submit">送信する</button>
        </form>
    </div>
    <footer>&copy; 2026 Jhon Nishi. All Rights Reserved.</footer>
</body>
</html>
