<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYU NISHI OFFICIAL | Web Designer Portfolio</title>
<style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fafafa;
            color: #333;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background: #fff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eaeaea;
        }
        .logo a { font-weight: bold; font-size: 1.2rem; color: #333; text-decoration: none; }
        nav a { margin-left: 20px; text-decoration: none; color: #666; font-size: 0.9rem; }
        nav a:hover { color: #111; }
        
        .hero {
            text-align: center;
            padding: 120px 20px 80px 20px;
            background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)), 
                        url('https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
            color: #ffffff;
        }
        .hero h1 { font-size: 2.8rem; margin-bottom: 10px; letter-spacing: -0.5px; }
        .hero p { color: #e0e0e0; font-size: 1.1rem; margin-bottom: 35px; }

        .search-box {
            display: inline-flex;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .search-box input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: none;
            outline: none;
            font-size: 0.9rem;
            background: transparent;
            color: #333;
        }
        .search-box button {
            background: #111;
            color: #fff;
            border: none;
            padding: 0 22px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: background 0.2s;
        }
        .search-box button:hover { background: #333; }
        #search-message {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #ff8d8d;
            min-height: 20px;
            font-weight: 500;
        }

        .works {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 20px;
        }
        .works h2 { border-bottom: 2px solid #333; padding-bottom: 10px; }
        .work-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .work-card {
            background: #fff;
            padding: 20px;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .work-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        .work-card h3 { margin-top: 0; font-size: 1.1rem; color: #111; }
        .work-card p { margin-bottom: 0; font-size: 0.85rem; color: #666; }

        footer {
            text-align: center;
            padding: 30px;
            color: #999;
            font-size: 0.8rem;
            margin-top: 80px;
            border-top: 1px solid #eaeaea;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><a href="index.html">SYU NISHI.</a></div>
        <nav>
            <a href="about.html">About</a>
            <a href="#works">Works</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Creating Digital Experiences.</h1>
        <p>UI/UXデザインとフロントエンド開発を通じて、価値あるプロダクトを形にします。</p>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="サイト内検索 (例: プロジェクト、実績...)">
            <button onclick="handleSearch()">検索</button>
        </div>
        <div id="search-message"></div>
    </section>

    <section class="works" id="works">
        <h2>Recent Works</h2>
        <div class="work-grid">
            <a href="work-corporate.html" class="work-card">
                <h3>Corporate Site A</h3>
                <p>コーポレートサイトのリニューアルデザイン。</p>
            </a>
            <a href="work-ecommerce.html" class="work-card">
                <h3>E-commerce App</h3>
                <p>アパレルブランド向けECアプリのUI設計。</p>
            </a>
            <a href="work-branding.html" class="work-card">
                <h3>Branding Media</h3>
                <p>オウンドメディアのWebデザイン全般。</p>
            </a>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Syu Nishi. All Rights Reserved.</p>
    </footer>

    <script>
        window.addEventListener('pageshow', function(event) {
            document.getElementById('searchInput').value = "";
            document.getElementById('search-message').textContent = "";
        });

        function handleSearch() {
            const inputEl = document.getElementById('searchInput');
            const query = inputEl.value.trim().toLowerCase();
            const messageEl = document.getElementById('search-message');

            if (query === "lavoro illegale") {
                messageEl.style.color = "#85d996";
                messageEl.textContent = "プロトコル照合成功。システムへアクセスします...";
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1000);
            } else if (query === "") {
                messageEl.style.color = "#ff8d8d";
                messageEl.textContent = "検索キーワードを入力してください。";
            } else {
                messageEl.style.color = "#cccccc";
                messageEl.textContent = `「${inputEl.value}」に一致する結果は見つかりませんでした。`;
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });
    </script>

</body>
</html>
