<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Systems - 認証ポータル</title>
    <style>
        body {
            font-family: monospace;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 400px;
            padding: 25px;
            border: 1px solid #30363d;
            background-color: #161b22;
            border-radius: 6px;
        }
        input[type="text"] {
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 10px;
            font-family: monospace;
            width: 70%;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-family: monospace;
            width: 70%;
        }
        button:hover { background-color: #2ea043; }
        #message {
            margin-top: 15px;
            font-size: 0.9rem;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <!-- 
      【ソースコードを見ているプレイヤーへ】
      管理者認証コード: project-echo-99
    -->

    <div class="container">
        <h2>管理者認証</h2>
        <p>アクセスコードを入力してください</p>

        <input type="text" id="passcode" placeholder="コードを入力...">
        <br>
        <button onclick="checkAndRedirect()">認証開始</button>

        <div id="message"></div>
    </div>

    <script>
        function checkAndRedirect() {
            const inputVal = document.getElementById('passcode').value.trim();
            const messageEl = document.getElementById('message');

            if (inputVal === "project-echo-99") {
                // 正解時の演出（メッセージを表示して1秒後に遷移）
                messageEl.style.color = "#58a6ff";
                messageEl.textContent = "認証成功。機密エリアへ転送中...";

                setTimeout(() => {
                    // 同じフォルダ内にある secret-room.html へ移動
                    window.location.href = "secret-room.html";
                }, 1000); // 1000ミリ秒（1秒）待ってから移動

            } else {
                // 不正解時
                messageEl.style.color = "#f85149";
                messageEl.textContent = "エラー: アクセス拒否";
            }
        }
    </script>

</body>
</html>
