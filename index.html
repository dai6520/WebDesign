<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATO REN | Web Designer Portfolio</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fafafa;
            color: #333;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background: #fff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eaeaea;
        }
        .logo { font-weight: bold; font-size: 1.2rem; }
        nav a { margin-left: 20px; text-decoration: none; color: #666; font-size: 0.9rem; }
        .hero {
            text-align: center;
            padding: 80px 20px 50px 20px;
            background: #ffffff;
        }
        .hero h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .hero p { color: #666; font-size: 1.1rem; margin-bottom: 30px; }

        /* 検索バーのスタイル */
        .search-box {
            display: inline-flex;
            max-width: 400px;
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .search-box input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            border: none;
            outline: none;
            font-size: 0.9rem;
        }
        .search-box button {
            background: #111;
            color: #fff;
            border: none;
            padding: 0 20px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .search-box button:hover { background: #333; }
        #search-message {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #d9534f;
            min-height: 20px;
        }

        .works {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
        }
        .works h2 { border-bottom: 2px solid #333; padding-bottom: 10px; }
        .work-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .work-card {
            background: #fff;
            padding: 20px;
            border: 1px solid #eaeaea;
            border-radius: 8px;
        }
        footer {
            text-align: center;
            padding: 30px;
            color: #999;
            font-size: 0.8rem;
            margin-top: 80px;
            border-top: 1px solid #eaeaea;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">SATO REN.</div>
        <nav>
            <a href="#about">About</a>
            <a href="#works">Works</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Creating Digital Experiences.</h1>
        <p>UI/UXデザインとフロントエンド開発を通じて、価値あるプロダクトを形にします。</p>
        
        <!-- 検索窓の設置 -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="サイト内検索 (例: プロジェクト、実績...)">
            <button onclick="handleSearch()">検索</button>
        </div>
        <div id="search-message"></div>
    </section>

    <section class="works" id="works">
        <h2>Recent Works</h2>
        <div class="work-grid">
            <div class="work-card">
                <h3>Corporate Site A</h3>
                <p>コーポレートサイトのリニューアルデザイン。</p>
            </div>
            <div class="work-card">
                <h3>E-commerce App</h3>
                <p>アパレルブランド向けECアプリのUI設計。</p>
            </div>
            <div class="work-card">
                <h3>Branding Media</h3>
                <p>オウンドメディアのWebデザイン全般。</p>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Sato Ren. All Rights Reserved.</p>
    </footer>

    <script>
        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const messageEl = document.getElementById('search-message');

            // 「lavoro illegale」と一致した場合のみlogin.htmlへ遷移
            if (query === "lavoro illegale") {
                messageEl.style.color = "#28a745";
                messageEl.textContent = "プロトコル照合成功。システムへアクセスします...";
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1000);
            } else if (query === "") {
                messageEl.style.color = "#d9534f";
                messageEl.textContent = "検索キーワードを入力してください。";
            } else {
                // 通常の言葉が検索された場合はダミーのエラーを返す
                messageEl.style.color = "#666";
                messageEl.textContent = `「${document.getElementById('searchInput').value}」に一致する結果は見つかりませんでした。`;
            }
        }

        // Enterキーを押したときにも検索が走るようにする
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });
    </script>

</body>
</html>
