<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Systems - メンテナンス中</title>
    <style>
        body {
            font-family: monospace;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 500px;
            padding: 20px;
            border: 1px solid #30363d;
            background-color: #161b22;
        }
        h1 { font-size: 1.5rem; color: #ff7b72; }
        input[type="text"] {
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px;
            font-family: monospace;
            width: 70%;
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-family: monospace;
        }
        button:hover { background-color: #2ea043; }
        .hidden-content {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border: 1px dashed #f85149;
            background-color: #21262d;
            text-align: left;
            color: #ffa657;
        }
    </style>
</head>
<body>

    <!-- 
      ========================================================
      【開発者メモ - 2026.03.14】
      プロトコルの緊急停止コードは以下の通り：
      コード: "project-echo-99"
      一般ユーザーには絶対に気づかれないように隠蔽すること。
      ========================================================
    -->

    <div class="container">
        <h1>[!] システムメンテナンス中</h1>
        <p>現在、全サーバーのデータ同期を行っています。<br>一般のアクセスは制限されています。</p>
        
        <div style="margin-top: 20px;">
            <p>管理者認証コードを入力してください：</p>
            <input type="text" id="passcode" placeholder="合言葉を入力...">
            <button onclick="checkCode()">認証</button>
        </div>

        <!-- 正解すると出現する秘密のエリア -->
        <div id="secret-content" class="hidden-content">
            <h3>access granted: 認証成功</h3>
            <p><strong>警告：</strong> このログを見ているということは、あなたはこのシステムの異常に気づいてしまったようです。</p>
            <p>次のステップへ進んでください。<br>
            隠しURL: <a href="#secret-room" style="color: #58a6ff;">/system-logs-v2.html</a></p>
        </div>
    </div>

    <script>
        function checkCode() {
            const inputVal = document.getElementById('passcode').value.trim();
            // 合言葉の判定
            if (inputVal === "project-echo-99") {
                document.getElementById('secret-content').style.display = "block";
            } else {
                alert("認証に失敗しました。コードが正しくありません。");
            }
        }
    </script>

</body>
</html>
