<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATO REN | Web Designer Portfolio</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fafafa;
            color: #333;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background: #fff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eaeaea;
        }
        .logo { font-weight: bold; font-size: 1.2rem; }
        nav a { margin-left: 20px; text-decoration: none; color: #666; font-size: 0.9rem; }
        .hero {
            text-align: center;
            padding: 100px 20px;
            background: #ffffff;
        }
        .hero h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .hero p { color: #666; font-size: 1.1rem; }
        .works {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
        }
        .works h2 { border-bottom: 2px solid #333; padding-bottom: 10px; }
        .work-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .work-card {
            background: #fff;
            padding: 20px;
            border: 1px solid #eaeaea;
            border-radius: 8px;
        }
        footer {
            text-align: center;
            padding: 30px;
            color: #999;
            font-size: 0.8rem;
            margin-top: 80px;
            border-top: 1px solid #eaeaea;
        }
        /* 隠し要素へのさりげないリンク（例：フッターのコピーライトの一部） */
        .secret-link {
            color: #999;
            text-decoration: none;
        }
        .secret-link:hover {
            color: #333; /* ホバーすると色が変わる等の違和感 */
        }
    </style>
</head>
<body>

    <!-- 
      【ARGヒント】
      表向きはデザイナーのポートフォリオだが、
      裏システムへのアクセス口は別の場所（または別ページ）に用意されている。
    -->

    <header>
        <div class="logo">SATO REN.</div>
        <nav>
            <a href="#about">About</a>
            <a href="#works">Works</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Creating Digital Experiences.</h1>
        <p>UI/UXデザインとフロントエンド開発を通じて、価値あるプロダクトを形にします。</p>
    </section>

    <section class="works" id="works">
        <h2>Recent Works</h2>
        <div class="work-grid">
            <div class="work-card">
                <h3>Corporate Site A</h3>
                <p>コーポレートサイトのリニューアルデザイン。</p>
            </div>
            <div class="work-card">
                <h3>E-commerce App</h3>
                <p>アパレルブランド向けECアプリのUI設計。</p>
            </div>
            <div class="work-card">
                <h3>Branding Media</h3>
                <p>オウンドメディアのWebデザイン全般。</p>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Sato Ren. All Rights Reserved. 
           <!-- プレイヤーがクリックしたくなるような、またはソースコードで気づく仕掛け -->
           <span style="margin-left: 15px;"><a href="login.html" class="secret-link">system_v2</a></span>
        </p>
    </footer>

</body>
</html>
