<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機密データアーカイブ</title>
    <style>
        body {
            font-family: monospace;
            background-color: #000;
            color: #00ff00;
            padding: 40px;
            margin: 0;
        }
        .terminal {
            border: 1px solid #00ff00;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
        }
        h1 { border-bottom: 1px dashed #00ff00; padding-bottom: 10px; }
        .warning { color: #ff0000; font-weight: bold; }
    </style>
</head>
<body>
    <div class="terminal">
        <h1>[ RESTRICTED AREA ]</h1>
        <p class="warning">⚠️ 警告: あなたのIPアドレスとアクセスログが記録されました。</p>
        <p>プロジェクト「ECHO」のログファイルへアクセス中...</p>
        <hr style="border-color: #00ff00;">
        <p>【未解決案件ファイル #099】</p>
        <p>2026年、某システム内で発生した異常現象についての調査記録。</p>
        <p>次の手がかりは公式X（旧Twitter）アカウントにある...</p>
    </div>
</body>
</html>
