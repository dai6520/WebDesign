<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | SATO REN Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fafafa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #ffffff;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            padding: 50px 30px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        .badge {
            display: inline-block;
            background-color: #f1f1f1;
            color: #666;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }
        h1 {
            font-size: 1.5rem;
            margin: 0 0 15px 0;
            color: #111;
        }
        p {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 0 0 35px 0;
        }
        .btn-return {
            background-color: #111;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            width: 100%;
            text-decoration: none;
            display: inline-block;
        }
        .btn-return:hover {
            background-color: #333;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">UNDER CONSTRUCTION</div>
        <h1>ただいま準備中です</h1>
        <p>
            こちらのページは現在リニューアル中、またはコンテンツの準備を進めております。公開まで今しばらくお待ちください。
        </p>

        <!-- 遷移前の画面（通常のポートフォリオ index.html）に戻るボタン -->
        <a href="index.html" class="btn-return">
            &larr; ポートフォリオに戻る
        </a>
    </div>

</body>
</html>
