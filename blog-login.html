<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Login | JHON NISHI</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #fff;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: #111;
        }
        p.subtitle {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: #333;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            box-sizing: border-box;
        }
        input[type="password"]:focus {
            border-color: #111;
        }
        .hint {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 25px;
            background: #f4f4f4;
            padding: 10px 12px;
            border-radius: 6px;
            text-align: left;
            border-left: 3px solid #111;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        button:hover {
            background: #333;
        }
        #error-msg {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #d9534f;
            min-height: 20px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>Private Blog Access</h1>
        <p class="subtitle">SYU NISHI Official Blog (Draft)</p>

        <form onsubmit="handleBlogLogin(event)">
            <div class="input-group">
                <label>パスワード</label>
                <input type="password" id="blogPass" placeholder="パスワードを入力" autocomplete="off" required>
            </div>
            
            <div class="hint">
                <strong>ヒント:</strong> 私の好きなデザインシステム
            </div>

            <button type="submit">ログイン</button>
        </form>

        <div id="error-msg"></div>

        <a href="index.html" class="back-link">&larr; ポートフォリオに戻る</a>
    </div>

    <script>
        function handleBlogLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('blogPass').value;
            const msgEl = document.getElementById('error-msg');

            // パスワードの判定（大文字・小文字やスペースも含めて完全一致）
            if (pass === "Atomic Design") {
                msgEl.style.color = "#28a745";
                msgEl.textContent = "認証成功。ブログページへ移動します...";
                setTimeout(() => {
                    window.location.href = "blog.html";
                }, 1000);
            } else {
                msgEl.style.color = "#d9534f";
                msgEl.textContent = "パスワードが正しくありません。";
            }
        }
    </script>

</body>
</html>
